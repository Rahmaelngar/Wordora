openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: wordora
    description: Wordora learning progress
paths:
  /wordora/chat:
    post:
      operationId: sendWordoraChat
      tags: [wordora]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TutorChatInput"
      responses:
        "200":
          description: Tutor reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorChatReply"
        "429":
          description: Please wait before trying again
  /wordora/audio:
    post:
      operationId: createWordoraAudio
      tags: [wordora]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningAudioInput"
      responses:
        "200":
          description: AI-generated pronunciation audio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningAudio"
  /wordora/assets/{file}:
    get:
      operationId: getWordoraAsset
      tags: [wordora]
      parameters:
        - in: path
          name: file
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public learning media
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /wordora/progress:
    get:
      operationId: getWordoraProgress
      tags: [wordora]
      summary: Get the signed-in user's learning progress
      responses:
        "200":
          description: Learning progress, initialized to an empty state when not saved yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordoraProgress"
        "401":
          description: Authentication required
    put:
      operationId: saveWordoraProgress
      tags: [wordora]
      summary: Save the signed-in user's learning progress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WordoraProgressInput"
      responses:
        "200":
          description: Saved learning progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordoraProgress"
        "400":
          description: Invalid progress data
        "401":
          description: Authentication required
components:
  schemas:
    TutorMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 1600
    TutorChatInput:
      type: object
      required: [language, messages]
      properties:
        language:
          type: string
          enum: [english, french, spanish, german, italian]
        messages:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/TutorMessage"
    TutorChatReply:
      type: object
      required: [reply]
      properties:
        reply:
          type: string
    LearningAudioInput:
      type: object
      required: [language, text]
      properties:
        language:
          type: string
          enum: [english, french, spanish, german, italian]
        text:
          type: string
          minLength: 1
          maxLength: 400
    LearningAudio:
      type: object
      required: [url]
      properties:
        url:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    WordoraProgress:
      type: object
      required:
        - selectedLanguage
        - completedLessons
        - savedWords
        - points
        - streak
        - lastActiveDate
        - quizAttempts
      properties:
        selectedLanguage:
          type: ["string", "null"]
          enum: [english, french, spanish, german, italian, null]
        completedLessons:
          type: array
          items:
            type: string
        savedWords:
          type: array
          items:
            type: string
        points:
          type: integer
          minimum: 0
        streak:
          type: integer
          minimum: 0
        lastActiveDate:
          type: ["string", "null"]
        quizAttempts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
    WordoraProgressInput:
      type: object
      required:
        - selectedLanguage
        - completedLessons
        - savedWords
        - points
        - streak
        - lastActiveDate
        - quizAttempts
      properties:
        selectedLanguage:
          type: ["string", "null"]
          enum: [english, french, spanish, german, italian, null]
        completedLessons:
          type: array
          items:
            type: string
        savedWords:
          type: array
          items:
            type: string
        points:
          type: integer
          minimum: 0
        streak:
          type: integer
          minimum: 0
        lastActiveDate:
          type: ["string", "null"]
        quizAttempts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0

