openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: wordora
    description: Wordora learning progress
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /wordora/progress:
    get:
      operationId: getWordoraProgress
      tags: [wordora]
      summary: Get the signed-in user's learning progress
      responses:
        "200":
          description: Learning progress, initialized to an empty state when not saved yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordoraProgress"
        "401":
          description: Authentication required
    put:
      operationId: saveWordoraProgress
      tags: [wordora]
      summary: Save the signed-in user's learning progress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WordoraProgressInput"
      responses:
        "200":
          description: Saved learning progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordoraProgress"
        "400":
          description: Invalid progress data
        "401":
          description: Authentication required
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    WordoraProgress:
      type: object
      required:
        - selectedLanguage
        - completedLessons
        - savedWords
        - points
        - streak
        - lastActiveDate
        - quizAttempts
      properties:
        selectedLanguage:
          type: ["string", "null"]
          enum: [english, french, spanish, german, italian, null]
        completedLessons:
          type: array
          items:
            type: string
        savedWords:
          type: array
          items:
            type: string
        points:
          type: integer
          minimum: 0
        streak:
          type: integer
          minimum: 0
        lastActiveDate:
          type: ["string", "null"]
        quizAttempts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
    WordoraProgressInput:
      type: object
      required:
        - selectedLanguage
        - completedLessons
        - savedWords
        - points
        - streak
        - lastActiveDate
        - quizAttempts
      properties:
        selectedLanguage:
          type: ["string", "null"]
          enum: [english, french, spanish, german, italian, null]
        completedLessons:
          type: array
          items:
            type: string
        savedWords:
          type: array
          items:
            type: string
        points:
          type: integer
          minimum: 0
        streak:
          type: integer
          minimum: 0
        lastActiveDate:
          type: ["string", "null"]
        quizAttempts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0

