kind = "web"
previewPath = "/"
title = "Wordora"
description = "An Arabic-first language learning app for beginners, with lessons, quizzes, saved vocabulary, progress, and rewards across five languages."
version = "1.0.0"
id = "artifacts/wordora"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23594

[services.development]
run = "pnpm --filter @workspace/wordora run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wordora", "run", "build" ]
serve = "static"
publicDir = "artifacts/wordora/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23594"
BASE_PATH = "/"
