<defs><linearGradient id="es-skin" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#8d5a3f"/><stop offset="1" stop-color="#6c412c"/></linearGradient><linearGradient id="es-hair" x1="0" y1="0" x2="0.5" y2="1"><stop offset="0" stop-color="#241a1e"/><stop offset="1" stop-color="#0f0a0c"/></linearGradient><linearGradient id="es-top" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#b07cf6"/><stop offset="1" stop-color="#7a43d6"/></linearGradient><linearGradient id="es-acc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9f6e"/><stop offset="1" stop-color="#ff9f6e"/></linearGradient><linearGradient id="es-bub" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#efe2ff"/></linearGradient>
<radialGradient id="es-shade" cx=".5" cy=".3" r=".7"><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#5a2a8a" stop-opacity=".18"/></radialGradient>
<radialGradient id="es-gnd"><stop offset="0" stop-color="#7a45c8" stop-opacity=".25"/><stop offset="1" stop-color="#7a45c8" stop-opacity="0"/></radialGradient></defs><style>
#es-arm{transform-box:view-box;transform-origin:258px 372px;animation:es-wave 1.1s ease-in-out infinite}
#es-head{transform-box:view-box;transform-origin:180px 330px;animation:es-bob 2.4s ease-in-out infinite}
#es-bubble{transform-box:view-box;transform-origin:180px 100px;animation:es-float 2.4s ease-in-out infinite}
#es-eyes{transform-box:view-box;transform-origin:180px 236px;animation:es-blink 4s infinite}
#es-spark{animation:es-twinkle 1.8s ease-in-out infinite}
#es-body{transform-box:view-box;transform-origin:180px 496px;animation:es-breathe 2.4s ease-in-out infinite}
@keyframes es-wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
@keyframes es-bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2.5deg)}}
@keyframes es-float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.04)}}
@keyframes es-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.15)}}
@keyframes es-twinkle{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes es-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.99)}}
@media (prefers-reduced-motion:reduce){#es-arm,#es-head,#es-bubble,#es-eyes,#es-spark,#es-body{animation:none}}
@media print{#es-arm,#es-head,#es-bubble,#es-eyes,#es-spark,#es-body{animation:none}}
</style>
