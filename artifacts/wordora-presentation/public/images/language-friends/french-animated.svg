<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" width="360" height="500" role="img" aria-label="Wordora language friend saying Bonjour!">
<defs><linearGradient id="fr-skin" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#c98d6b"/><stop offset="1" stop-color="#a96e50"/></linearGradient><linearGradient id="fr-hair" x1="0" y1="0" x2="0.5" y2="1"><stop offset="0" stop-color="#2e1f2b"/><stop offset="1" stop-color="#160e16"/></linearGradient><linearGradient id="fr-top" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#f3eaff"/><stop offset="1" stop-color="#c9b2f2"/></linearGradient><linearGradient id="fr-acc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fd0a3"/><stop offset="1" stop-color="#5fd0a3"/></linearGradient><linearGradient id="fr-bub" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#efe2ff"/></linearGradient>
<radialGradient id="fr-shade" cx=".5" cy=".3" r=".7"><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#5a2a8a" stop-opacity=".18"/></radialGradient>
<radialGradient id="fr-gnd"><stop offset="0" stop-color="#7a45c8" stop-opacity=".25"/><stop offset="1" stop-color="#7a45c8" stop-opacity="0"/></radialGradient></defs><style>
#fr-arm{transform-box:view-box;transform-origin:258px 372px;animation:fr-wave 1.1s ease-in-out infinite}
#fr-head{transform-box:view-box;transform-origin:180px 330px;animation:fr-bob 2.4s ease-in-out infinite}
#fr-bubble{transform-box:view-box;transform-origin:180px 100px;animation:fr-float 2.4s ease-in-out infinite}
#fr-eyes{transform-box:view-box;transform-origin:180px 236px;animation:fr-blink 4s infinite}
#fr-spark{animation:fr-twinkle 1.8s ease-in-out infinite}
#fr-body{transform-box:view-box;transform-origin:180px 496px;animation:fr-breathe 2.4s ease-in-out infinite}
@keyframes fr-wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
@keyframes fr-bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2.5deg)}}
@keyframes fr-float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.04)}}
@keyframes fr-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.15)}}
@keyframes fr-twinkle{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes fr-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.99)}}
@media (prefers-reduced-motion:reduce){#fr-arm,#fr-head,#fr-bubble,#fr-eyes,#fr-spark,#fr-body{animation:none}}
@media print{#fr-arm,#fr-head,#fr-bubble,#fr-eyes,#fr-spark,#fr-body{animation:none}}
</style>
