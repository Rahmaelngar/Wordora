<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" width="360" height="500" role="img" aria-label="Wordora language friend saying Ciao!">
<defs><linearGradient id="it-skin" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#e0aa84"/><stop offset="1" stop-color="#c48a64"/></linearGradient><linearGradient id="it-hair" x1="0" y1="0" x2="0.5" y2="1"><stop offset="0" stop-color="#8a3b2a"/><stop offset="1" stop-color="#5c2219"/></linearGradient><linearGradient id="it-top" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#d7b6ff"/><stop offset="1" stop-color="#9c6ae8"/></linearGradient><linearGradient id="it-acc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd15d"/><stop offset="1" stop-color="#ffd15d"/></linearGradient><linearGradient id="it-bub" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#efe2ff"/></linearGradient>
<radialGradient id="it-shade" cx=".5" cy=".3" r=".7"><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#5a2a8a" stop-opacity=".18"/></radialGradient>
<radialGradient id="it-gnd"><stop offset="0" stop-color="#7a45c8" stop-opacity=".25"/><stop offset="1" stop-color="#7a45c8" stop-opacity="0"/></radialGradient></defs><style>
#it-arm{transform-box:view-box;transform-origin:258px 372px;animation:it-wave 1.1s ease-in-out infinite}
#it-head{transform-box:view-box;transform-origin:180px 330px;animation:it-bob 2.4s ease-in-out infinite}
#it-bubble{transform-box:view-box;transform-origin:180px 100px;animation:it-float 2.4s ease-in-out infinite}
#it-eyes{transform-box:view-box;transform-origin:180px 236px;animation:it-blink 4s infinite}
#it-spark{animation:it-twinkle 1.8s ease-in-out infinite}
#it-body{transform-box:view-box;transform-origin:180px 496px;animation:it-breathe 2.4s ease-in-out infinite}
@keyframes it-wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
@keyframes it-bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2.5deg)}}
@keyframes it-float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.04)}}
@keyframes it-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.15)}}
@keyframes it-twinkle{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes it-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.99)}}
@media (prefers-reduced-motion:reduce){#it-arm,#it-head,#it-bubble,#it-eyes,#it-spark,#it-body{animation:none}}
@media print{#it-arm,#it-head,#it-bubble,#it-eyes,#it-spark,#it-body{animation:none}}
</style>
