<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" width="360" height="500" role="img" aria-label="Wordora language friend saying Merhaba!">
<defs><linearGradient id="tr-skin" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#b77b56"/><stop offset="1" stop-color="#95603f"/></linearGradient><linearGradient id="tr-hair" x1="0" y1="0" x2="0.5" y2="1"><stop offset="0" stop-color="#3a2440"/><stop offset="1" stop-color="#1f1124"/></linearGradient><linearGradient id="tr-top" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#7d4fe0"/><stop offset="1" stop-color="#4f25a8"/></linearGradient><linearGradient id="tr-acc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8fb1"/><stop offset="1" stop-color="#ff8fb1"/></linearGradient><linearGradient id="tr-bub" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#efe2ff"/></linearGradient>
<radialGradient id="tr-shade" cx=".5" cy=".3" r=".7"><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#5a2a8a" stop-opacity=".18"/></radialGradient>
<radialGradient id="tr-gnd"><stop offset="0" stop-color="#7a45c8" stop-opacity=".25"/><stop offset="1" stop-color="#7a45c8" stop-opacity="0"/></radialGradient></defs><style>
#tr-arm{transform-box:view-box;transform-origin:258px 372px;animation:tr-wave 1.1s ease-in-out infinite}
#tr-head{transform-box:view-box;transform-origin:180px 330px;animation:tr-bob 2.4s ease-in-out infinite}
#tr-bubble{transform-box:view-box;transform-origin:180px 100px;animation:tr-float 2.4s ease-in-out infinite}
#tr-eyes{transform-box:view-box;transform-origin:180px 236px;animation:tr-blink 4s infinite}
#tr-spark{animation:tr-twinkle 1.8s ease-in-out infinite}
#tr-body{transform-box:view-box;transform-origin:180px 496px;animation:tr-breathe 2.4s ease-in-out infinite}
@keyframes tr-wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
@keyframes tr-bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2.5deg)}}
@keyframes tr-float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.04)}}
@keyframes tr-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.15)}}
@keyframes tr-twinkle{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes tr-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.99)}}
@media (prefers-reduced-motion:reduce){#tr-arm,#tr-head,#tr-bubble,#tr-eyes,#tr-spark,#tr-body{animation:none}}
@media print{#tr-arm,#tr-head,#tr-bubble,#tr-eyes,#tr-spark,#tr-body{animation:none}}
</style>
